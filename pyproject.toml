[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-llm"
version = "0.1.0"
description = "Automated LLM Red-Teaming, Jailbreak Fuzzing & Vulnerability Assessment Platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Eren Veli Taş"}
]
keywords = [
    "llm-security",
    "red-teaming",
    "jailbreak-detection",
    "prompt-injection",
    "owasp-llm-top-10",
    "ai-safety",
    "adversarial-robustness"
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "rich>=13.8.0",
    "jinja2>=3.1.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
aegis = "aegis.cli.main:main"
